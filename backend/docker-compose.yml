name: pricematch

services:
  pricematch-backend:
    image: backend-pricematch:latest
    container_name: backend-pricematch
    ports:
      - "8083:8083"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: "-Doracle.jdbc.timezoneAsRegion=false"