spring.application.name=price-intelligence-backend

# ============================================================
#  Server
# ============================================================
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# ============================================================
#  PostgreSQL datasource
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/price_intel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:price_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:price_admin_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
#  JPA / Hibernate
# ============================================================
# Hibernate no longer changes the schema — Flyway owns it (see below).
# `validate` means the app refuses to start if the database does not match the
# entities, instead of running on with a missing column and quietly producing
# wrong data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ============================================================
#  Flyway — the database schema lives in version control
#
#  Numbered files in db/migration are applied in order and recorded, so a fresh
#  laptop, a staging box and a client server all reach the same structure by
#  running the same steps. Schema changes go in a NEW file (V2, V3, ...) — never
#  by editing an applied one, and never by hand against a database.
#
#  baseline-on-migrate stamps an already-populated database as being at V1
#  rather than trying to re-create tables that exist. It is what let the
#  existing database adopt Flyway without being rebuilt.
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Refuse to start on a checksum mismatch — an applied migration having been
# edited is a real problem, not something to repair silently.
spring.flyway.validate-on-migrate=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
#  JWT (override these via environment variables in production)
#  Secret must be at least 32 characters for HS256.
# ============================================================
app.jwt.secret=${JWT_SECRET:change-me-in-production-price-intelligence-super-secret-key-0123456789}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:900000}
# How long one sign-in lasts, whatever the user does in the meantime.
#
# The session's whole length is fixed at login: refreshing swaps the 15-minute
# access token for a new one but keeps the original end time, so a user who
# never signs out is signed out 5 hours after signing in. Before this, each
# refresh started a new 7-day window, so anyone who used the app weekly stayed
# signed in indefinitely.
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXP_MS:18000000}
# "Remember me" is held to the same 5 hours, or ticking it would side-step the
# rule entirely. Raise this alone to let remembered sessions last longer.
app.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXP_MS:18000000}

# ============================================================
#  Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================================
#  Amazon Selling Partner API (SP-API)
#  Disabled by default. Provide credentials via environment variables
#  and set enabled=true to activate the real integration.
# ============================================================
amazon.sp-api.enabled=${AMAZON_SPAPI_ENABLED:false}
amazon.sp-api.region=${AMAZON_SPAPI_REGION:NA}
amazon.sp-api.marketplace-id=${AMAZON_MARKETPLACE_ID:ATVPDKIKX0DER}
amazon.sp-api.client-id=${AMAZON_LWA_CLIENT_ID:}
amazon.sp-api.client-secret=${AMAZON_LWA_CLIENT_SECRET:}
amazon.sp-api.refresh-token=${AMAZON_LWA_REFRESH_TOKEN:}
amazon.sp-api.lwa-token-url=${AMAZON_LWA_TOKEN_URL:https://api.amazon.com/auth/o2/token}
amazon.sp-api.connect-timeout-ms=5000
amazon.sp-api.read-timeout-ms=15000
amazon.sp-api.max-retries=3
amazon.sp-api.rate-per-second=2

# An ASIN is global but its PRICE is not — a UK-only product resolves in the US
# catalogue with no price. When a lookup finds the product but no price, retry it
# in the next marketplace until one has a price. Marketplaces are tried in the
# order below (ids or country codes); the configured marketplace-id always goes
# first. Each attempt costs API calls against the rate limit, hence the cap.
amazon.sp-api.region-fallback-enabled=${AMAZON_REGION_FALLBACK:true}
amazon.sp-api.search-marketplace-ids=${AMAZON_SEARCH_MARKETPLACES:US,UK,DE,CA,IN,JP,AU,FR,IT,ES}
amazon.sp-api.max-region-attempts=${AMAZON_MAX_REGION_ATTEMPTS:4}

# competitivePrice reports only the FEATURED (Buy Box) offer, so an item with
# live offers but no Buy Box winner comes back with no price. getItemOffers reads
# the offer list directly and recovers those — but it costs one call per item
# (competitivePrice does 20 at once), so it runs only on items still unpriced
# after the batch pass, and only this many per search.
amazon.sp-api.offer-fallback-enabled=${AMAZON_OFFER_FALLBACK:true}
amazon.sp-api.max-offer-lookups=${AMAZON_MAX_OFFER_LOOKUPS:5}

# ============================================================
#  Keepa API (Amazon product & price data — the Amazon data source)
#  Disabled by default. Get an API key from keepa.com, then set
#  KEEPA_ENABLED=true and KEEPA_API_KEY. domain: 1=US,2=UK,3=DE,10=IN,...
# ============================================================
keepa.enabled=${KEEPA_ENABLED:false}
keepa.api-key=${KEEPA_API_KEY:}
keepa.domain=${KEEPA_DOMAIN:1}
keepa.base-url=${KEEPA_BASE_URL:https://api.keepa.com}
keepa.connect-timeout-ms=5000
keepa.read-timeout-ms=20000
keepa.max-retries=3
keepa.rate-per-second=1

# ============================================================
#  Amazon page scraper — ASIN lookups outside the SP-API authorisation
#  This SP-API account is authorised for the US and Canada; every other
#  marketplace answers HTTP 403. An ASIN searched in the UK, Germany or
#  India therefore cannot be looked up officially at all, and this reads
#  the public product page for those storefronts only.
#
#  Disabled by default. Set AMAZON_SCRAPER_ENABLED=true and the base URL.
#  Supported storefronts: US, CA, GB, DE, IN.
# ============================================================
amazon.scraper.enabled=${AMAZON_SCRAPER_ENABLED:false}
amazon.scraper.base-url=${AMAZON_SCRAPER_URL:}
# Marketplaces the official API covers, which the scraper must never be used for.
amazon.scraper.sp-api-regions=${AMAZON_SCRAPER_SP_API_REGIONS:US,CA}
amazon.scraper.connect-timeout-ms=10000
# Every call launches a real browser: 5-15s found, ~37s when the ASIN is nowhere.
amazon.scraper.read-timeout-ms=90000
# A converted price is an import quote including duty and shipping, not the
# domestic shelf price. Left out of results unless this is turned on — and it
# should only be turned on once the scraper has an in-country proxy, at which
# point it reports prices as `ok` anyway.
amazon.scraper.accept-converted-prices=${AMAZON_SCRAPER_ACCEPT_CONVERTED:false}

# ============================================================
#  eBay Browse API
#  Disabled by default. Provide credentials via environment variables
#  and set enabled=true to activate.
# ============================================================
ebay.browse-api.enabled=${EBAY_ENABLED:false}
ebay.browse-api.environment=${EBAY_ENV:PRODUCTION}
ebay.browse-api.client-id=${EBAY_CLIENT_ID:}
ebay.browse-api.client-secret=${EBAY_CLIENT_SECRET:}
ebay.browse-api.marketplace-id=${EBAY_MARKETPLACE_ID:EBAY_US}
ebay.browse-api.scope=${EBAY_SCOPE:https://api.ebay.com/oauth/api_scope}
# Five seconds was too tight. eBay's endpoints are in the US and the TLS
# handshake alone measured 7 seconds from here at peak, so a healthy, reachable
# eBay was reported as a provider error twice a day — once per token expiry.
ebay.browse-api.connect-timeout-ms=${EBAY_CONNECT_TIMEOUT_MS:15000}
ebay.browse-api.read-timeout-ms=${EBAY_READ_TIMEOUT_MS:30000}
ebay.browse-api.max-retries=3
ebay.browse-api.rate-per-second=5

# ============================================================
#  Client onboarding / activation
# ============================================================
# Must be an address the CLIENT's browser can reach — never localhost, or the
# activation link opens on the recipient's own machine instead of the app.
# This is where the frontend is served from (Prativa's dev machine).
app.frontend-url=${FRONTEND_URL:http://192.168.10.233:5174}
app.activation.expiry-hours=${ACTIVATION_EXPIRY_HOURS:48}
app.self-registration.expiry-minutes=${SELF_REG_EXPIRY_MINUTES:30}
app.support-email=${SUPPORT_EMAIL:support@priceintel.com}

# Where landing-page enquiries are announced. A lead nobody is told about is the
# same as a lead that never arrived, and the Submissions screen is only checked
# by someone who already suspects there is something on it.
#
# A fixed address, never the one the visitor typed: the form takes no login, so
# anything driven by its contents would let a stranger aim the platform's
# mailbox wherever they liked. Blank turns the email off and leaves the in-app
# notification, which is what happens when SMTP is not configured anyway.
app.leads.notify-email=${LEADS_NOTIFY_EMAIL:${SUPPORT_EMAIL:support@priceintel.com}}

# Secret used to AES-encrypt stored credentials (marketplace keys, etc.).
# MUST be overridden with a strong value via CRYPTO_SECRET in real environments.
app.crypto.secret=${CRYPTO_SECRET:change-me-dev-secret-please-override}

# ============================================================
#  Security posture
#
#  strict-secrets makes placeholder secrets fatal at startup instead of a
#  warning. Leave false locally; set it true wherever this is deployed, so a
#  deployment cannot quietly run on keys that are published in the source.
#
#  NOTE ON CHANGING CRYPTO_SECRET: stored marketplace credentials, SMTP
#  passwords and webhook URLs are encrypted with it. Changing it makes existing
#  values undecryptable — they must be re-entered on the Settings screens after
#  the change. Plan that before rotating it in an environment with data.
# ============================================================
app.security.strict-secrets=${SECURITY_STRICT_SECRETS:false}

# Allowed browser origins. "*" with credentials is unsafe and is rejected by
# browsers anyway when cookies or auth headers are involved; list the real
# front-end origins instead.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://192.168.10.233:5174,http://192.168.10.253:5173,http://192.168.10.253:5174}

# ============================================================
#  Stripe payments — disabled by default.
#  When disabled, checkout runs in MOCK mode (testable without keys).
#  To go live: set STRIPE_ENABLED=true and provide the keys.
# ============================================================
stripe.enabled=${STRIPE_ENABLED:false}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:usd}
stripe.base-url=${STRIPE_BASE_URL:https://api.stripe.com}

# ============================================================
#  Email (SMTP) — disabled by default.
#  When disabled, emails are LOGGED instead of sent (dev friendly).
#  To send for real: set MAIL_ENABLED=true and provide SMTP credentials.
# ============================================================
mail.enabled=${MAIL_ENABLED:true}
mail.from=${MAIL_FROM:tapaslenka052@gmail.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tapaslenka052@gmail.com}
# No default: a working password committed here is a credential anyone with the
# repository can use. Set MAIL_PASSWORD in the environment (run-backend.ps1
# locally, which is git-ignored). Startup warns if mail is enabled without it.
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# ============================================================
#  OpenAI (AI Gateway) — disabled by default.
#  Provide OPENAI_API_KEY and set enabled=true to activate.
#  When disabled, matching falls back to the deterministic rules engine.
# ============================================================
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.connect-timeout-ms=5000
# Must outlast the slowest judging batch: 40 listings takes about 28s, and
# long Amazon titles push it further. At 30s those batches were cut off
# mid-reply and came back with no verdicts at all.
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:90000}
openai.max-retries=2
# Groq's free tier allows 8000 tokens/minute. Batched judging costs ~2400 tokens
# per call (measured from x-ratelimit-remaining-tokens), so ~3 calls a minute.
# Overspending does not return 429 — the reply is truncated and comes back as
# HTTP 400 json_validate_failed, which reads as a prompt bug rather than a quota.
# Raise it for a paid tier or a local model, where the ceiling is different.
openai.requests-per-minute=${OPENAI_RPM:3}
# How many listings the match judge decides per request, and per search.
# Measured on gpt-4o-mini: 40 verdicts = 2,897 output tokens in 28s, nothing
# truncated; 100 in one request also works but takes 82s and a truncated reply
# would lose all of them. Batches keep a failure to its own listings.
openai.judge-batch-size=${OPENAI_JUDGE_BATCH:40}
openai.judge-max-listings=${OPENAI_JUDGE_MAX:120}
# Batches run at the same time: judging is almost all waiting for the model, so
# running them one after another simply made a person wait longer for the same
# answer. Bounded, because the per-minute limit above still applies.
openai.judge-concurrency=${OPENAI_JUDGE_CONCURRENCY:3}
# A model that can search the web, used only to suggest an ASIN for a product we
# know by name. Every suggestion is verified against the marketplace before it is
# shown, because a model will answer confidently either way.
openai.web-search-model=${OPENAI_WEB_SEARCH_MODEL:}

# ============================================================
#  Shared competitor-search cache
#  What a marketplace returns for a query is a fact about the marketplace, not
#  about the client who asked — so a fetch is reused across products and clients
#  instead of being paid for twice. Because the search term is the product's
#  identifier where one exists, two clients tracking the same product hit the
#  same key. Callers can bypass this per request (forceRefresh / ?refresh=true).
# ============================================================
app.competitor-cache.enabled=${COMPETITOR_CACHE_ENABLED:true}
app.competitor-cache.ttl-hours=${COMPETITOR_CACHE_TTL_HOURS:48}

# ============================================================
#  Scheduled competitor monitors
#  Ticks often and does a little each time: marketplace quota is shared across
#  tenants, so a large sweep in one burst would throttle every client at once.
#  batch-size is the real throttle on marketplace spend.
# ============================================================
app.monitors.enabled=${MONITORS_ENABLED:true}
app.monitors.tick-ms=${MONITORS_TICK_MS:300000}
app.monitors.batch-size=${MONITORS_BATCH_SIZE:10}

# --- Subscription expiry ------------------------------------------------------
# Days of full access after the paid-through date, so a customer who pays a day
# late is not cut off. After that the company is read-only: it can sign in, see
# and export its data and pay to upgrade, but not search, add products or run
# monitors, and its monitors and alerts are paused.
app.subscription.grace-days=${SUBSCRIPTION_GRACE_DAYS:3}
# Nightly job that marks lapsed companies EXPIRED and finished, paid-past trials ACTIVE.
app.scheduler.expiry-cron=${SUBSCRIPTION_EXPIRY_CRON:0 15 0 * * *}
# Reminder emails before the paid-through date, in days. Emailed to the company
# address and its active admins, from the platform mailbox; also shown in-app.
# An "expired" notice follows when the account becomes read-only.
app.subscription.reminder-days=${SUBSCRIPTION_REMINDER_DAYS:3,1}
app.scheduler.reminder-cron=${SUBSCRIPTION_REMINDER_CRON:0 0 9 * * *}

# ============================================================
#  File upload (CSV / Excel import)
# ============================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ============================================================
#  Logging
# ============================================================
logging.level.root=INFO
logging.level.com.priceintel.backend=DEBUG
logging.level.org.springframework.security=INFO

# ============================================================
#  Value status (FR-REPORT-001)
#  Every number carries actual / calculated / estimated / stale / unavailable.
#  An observation older than this is reported as STALE — defaulted to the
#  competitor cache TTL, since past that point the system would not reuse the
#  figure itself and should not present it as current either.
# ============================================================
app.value-status.stale-after-hours=${VALUE_STALE_AFTER_HOURS:48}
# A model that can look at an image, used to turn a photo into search words.
# Vision is not general: on Groq, qwen/qwen3.6-27b accepts images and the other
# chat models answer HTTP 400. Blank disables image search.
openai.vision-model=${OPENAI_VISION_MODEL:}
